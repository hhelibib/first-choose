<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <style>
    :root {
      --bg: #faf8ef;
      --text: #776e65;
      --board: #bbada0;
      --empty: rgba(238, 228, 218, 0.35);
      --button: #8f7a66;
      --gap: 12px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 28px 16px 48px;
    }

    .wrap { width: min(100%, 460px); }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 64px;
      line-height: 0.9;
      font-weight: 800;
    }

    .scores { display: flex; gap: 8px; }

    .score-box {
      position: relative;
      min-width: 78px;
      padding: 6px 14px 8px;
      border-radius: 4px;
      background: var(--board);
      color: #eee4da;
      text-align: center;
    }

    .score-box span {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .score-box strong {
      display: block;
      margin-top: 2px;
      color: #fff;
      font-size: 22px;
      line-height: 1.1;
    }

    .float-score {
      position: absolute;
      left: 0;
      right: 0;
      top: 8px;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      pointer-events: none;
      animation: float-up 600ms ease forwards;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 14px 0 18px;
    }

    .hint {
      margin: 0;
      font-size: 15px;
      line-height: 1.45;
      font-weight: 600;
    }

    button {
      border: 0;
      border-radius: 4px;
      background: var(--button);
      color: #f9f6f2;
      font: inherit;
      font-weight: 700;
      min-height: 44px;
      padding: 0 16px;
      cursor: pointer;
    }

    button:hover { background: #9f8b77; }
    button:focus-visible { outline: 3px solid #f2b179; outline-offset: 2px; }

    .board-wrap { position: relative; }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--gap);
      padding: var(--gap);
      background: var(--board);
      border-radius: 8px;
      touch-action: none;
      user-select: none;
      aspect-ratio: 1;
    }

    .board.no-anim .tile { transition: none; }

    .cell {
      background: var(--empty);
      border-radius: 6px;
    }

    .tile {
      position: absolute;
      left: 0;
      top: 0;
      z-index: 2;
      transition: transform 120ms ease-in;
    }

    .tile-inner {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: #3c3a32;
      color: #f9f6f2;
      font-weight: 800;
      font-size: 34px;
      line-height: 1;
    }

    .tile[data-len="3"] .tile-inner { font-size: 30px; }
    .tile[data-len="4"] .tile-inner { font-size: 24px; }
    .tile[data-len="5"] .tile-inner,
    .tile[data-len="6"] .tile-inner { font-size: 18px; }

    .tile[data-v="2"] .tile-inner { background: #eee4da; color: #776e65; }
    .tile[data-v="4"] .tile-inner { background: #ede0c8; color: #776e65; }
    .tile[data-v="8"] .tile-inner { background: #f2b179; }
    .tile[data-v="16"] .tile-inner { background: #f59563; }
    .tile[data-v="32"] .tile-inner { background: #f67c5f; }
    .tile[data-v="64"] .tile-inner { background: #f65e3b; }
    .tile[data-v="128"] .tile-inner { background: #edcf72; }
    .tile[data-v="256"] .tile-inner { background: #edcc61; }
    .tile[data-v="512"] .tile-inner { background: #edc850; }
    .tile[data-v="1024"] .tile-inner { background: #edc53f; }
    .tile[data-v="2048"] .tile-inner { background: #edc22e; }

    .tile.is-new .tile-inner { animation: appear 120ms ease; }
    .tile.pop .tile-inner { animation: pop 160ms ease; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      border-radius: 8px;
      background: rgba(238, 228, 218, 0.75);
      text-align: center;
    }

    .overlay[hidden] { display: none; }

    .overlay p {
      margin: 0;
      font-size: 42px;
      font-weight: 800;
    }

    .overlay .actions { display: flex; gap: 10px; }

    .help {
      margin: 16px 0 0;
      font-size: 13px;
      line-height: 1.5;
    }

    @keyframes appear {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    @keyframes pop {
      0% { transform: scale(0.85); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    @keyframes float-up {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-28px); }
    }

    @media (max-width: 480px) {
      h1 { font-size: 52px; }
      .tile-inner { font-size: 28px; }
      .tile[data-len="3"] .tile-inner { font-size: 24px; }
      .overlay p { font-size: 34px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile, .tile-inner, .float-score { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box" id="score-box">
          <span>分数</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-box">
          <span>最高</span>
          <strong id="best">0</strong>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <p class="hint">合并相同数字，凑出 <strong>2048</strong>！</p>
      <button type="button" id="restart">新游戏</button>
    </div>
    <div class="board-wrap">
      <div class="board" id="board" role="application" aria-label="2048 棋盘"></div>
      <div class="overlay" id="overlay" hidden>
        <p id="message">游戏结束</p>
        <div class="actions">
          <button type="button" id="continue" hidden>继续游戏</button>
          <button type="button" id="restart-overlay">再来一局</button>
        </div>
      </div>
    </div>
    <p class="help">方向键、WASD，或在棋盘上滑动。每次移动后会出现一个新的 2 或 4。</p>
    <p id="status" aria-live="polite" hidden></p>
  </main>
  <script>
    const SIZE = 4;
    const DIRS = {
      left: [0, -1],
      right: [0, 1],
      up: [-1, 0],
      down: [1, 0]
    };

    let seq = 1;

    function inBounds(r, c) {
      return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
    }

    function makeTile(r, c, value) {
      return { id: seq++, r, c, value, isNew: true, merged: false };
    }

    function farthest(grid, r, c, dr, dc) {
      let fr = r;
      let fc = c;
      let nr = r + dr;
      let nc = c + dc;
      while (inBounds(nr, nc) && grid[nr][nc] == null) {
        fr = nr;
        fc = nc;
        nr += dr;
        nc += dc;
      }
      return {
        r: fr,
        c: fc,
        next: inBounds(nr, nc) ? { r: nr, c: nc } : null
      };
    }

    function moveBoard(input, dir) {
      const tiles = input.map((tile) => ({ ...tile, isNew: false, merged: false }));
      const grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
      tiles.forEach((tile) => {
        grid[tile.r][tile.c] = tile;
      });

      const [dr, dc] = DIRS[dir];
      const rows = [...Array(SIZE).keys()];
      const cols = [...Array(SIZE).keys()];
      if (dr > 0) rows.reverse();
      if (dc > 0) cols.reverse();

      let moved = false;
      let gained = 0;
      const removed = [];

      for (const r of rows) {
        for (const c of cols) {
          const tile = grid[r][c];
          if (!tile) continue;
          const far = farthest(grid, r, c, dr, dc);
          const other = far.next ? grid[far.next.r][far.next.c] : null;
          if (other && other.value === tile.value && !other.merged) {
            grid[r][c] = null;
            other.value *= 2;
            other.merged = true;
            tile.r = other.r;
            tile.c = other.c;
            removed.push(tile);
            gained += other.value;
            moved = true;
            continue;
          }
          if (far.r !== r || far.c !== c) {
            grid[r][c] = null;
            grid[far.r][far.c] = tile;
            tile.r = far.r;
            tile.c = far.c;
            moved = true;
          }
        }
      }

      return {
        tiles: tiles.filter((tile) => !removed.includes(tile)),
        removed,
        moved,
        gained
      };
    }

    function hasMoves(tiles) {
      if (tiles.length < SIZE * SIZE) return true;
      const grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
      tiles.forEach((tile) => {
        grid[tile.r][tile.c] = tile;
      });
      return tiles.some((tile) =>
        [[0, 1], [1, 0]].some(([dr, dc]) => {
          const nr = tile.r + dr;
          const nc = tile.c + dc;
          return inBounds(nr, nc) && grid[nr][nc] && grid[nr][nc].value === tile.value;
        })
      );
    }

    function emptyCells(tiles) {
      const taken = new Set(tiles.map((tile) => tile.r + "," + tile.c));
      const empty = [];
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (!taken.has(r + "," + c)) empty.push([r, c]);
        }
      }
      return empty;
    }

    if (typeof document !== "undefined") {
      document.addEventListener("DOMContentLoaded", init);
    }

    function init() {
      const board = document.getElementById("board");
      const overlay = document.getElementById("overlay");
      const message = document.getElementById("message");
      const continueBtn = document.getElementById("continue");
      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const scoreBox = document.getElementById("score-box");
      const status = document.getElementById("status");
      const cells = [];

      for (let i = 0; i < SIZE * SIZE; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        board.appendChild(cell);
        cells.push(cell);
      }

      const tileEls = new Map();
      let tiles = [];
      let score = 0;
      let best = loadBest();
      let won = false;
      let continued = false;
      let over = false;
      bestEl.textContent = String(best);

      function loadBest() {
        try {
          return Number(localStorage.getItem("best-2048")) || 0;
        } catch (err) {
          return 0;
        }
      }

      function saveBest() {
        try {
          localStorage.setItem("best-2048", String(best));
        } catch (err) {}
      }

      function position(el, r, c) {
        const cell = cells[r * SIZE + c];
        el.style.width = cell.offsetWidth + "px";
        el.style.height = cell.offsetHeight + "px";
        el.style.transform = "translate(" + cell.offsetLeft + "px, " + cell.offsetTop + "px)";
      }

      function replay(el, className) {
        el.classList.remove(className);
        void el.offsetWidth;
        el.classList.add(className);
      }

      function render(removed, animate) {
        if (!animate) board.classList.add("no-anim");
        const fading = new Set(removed.map((tile) => tile.id));

        tiles.concat(removed).forEach((tile) => {
          let el = tileEls.get(tile.id);
          const created = !el;
          if (!el) {
            el = document.createElement("div");
            el.className = "tile" + (tile.isNew ? " is-new" : "");
            el.innerHTML = '<div class="tile-inner"></div>';
            tileEls.set(tile.id, el);
            el.style.transition = "none";
          }
          el.dataset.v = String(tile.value > 2048 ? "super" : tile.value);
          el.dataset.len = String(tile.value).length;
          el.querySelector(".tile-inner").textContent = String(tile.value);
          if (tile.isNew) el.classList.add("is-new");
          else el.classList.remove("is-new");
          if (created) {
            position(el, tile.r, tile.c);
            board.appendChild(el);
            void el.offsetWidth;
            el.style.transition = "";
          } else {
            position(el, tile.r, tile.c);
          }
          if (tile.merged && animate) replay(el, "pop");
          else el.classList.remove("pop");
          tile.isNew = false;
          tile.merged = false;
        });

        window.setTimeout(() => {
          fading.forEach((id) => {
            const el = tileEls.get(id);
            if (el) el.remove();
            tileEls.delete(id);
          });
        }, animate ? 130 : 0);

        if (!animate) {
          requestAnimationFrame(() => board.classList.remove("no-anim"));
        }
      }

      function updateScore(gained) {
        scoreEl.textContent = String(score);
        if (score > best) {
          best = score;
          bestEl.textContent = String(best);
          saveBest();
        }
        if (gained > 0) {
          const floater = document.createElement("div");
          floater.className = "float-score";
          floater.textContent = "+" + gained;
          scoreBox.appendChild(floater);
          window.setTimeout(() => floater.remove(), 600);
        }
      }

      function showOverlay(kind) {
        const win = kind === "win" || kind === "win-dead";
        message.textContent = win ? "你赢了！" : "游戏结束";
        continueBtn.hidden = kind !== "win";
        overlay.hidden = false;
        status.textContent = kind === "win"
          ? "达到 2048，你可以继续游戏。"
          : kind === "win-dead"
            ? "达到 2048，但没有更多步数了。"
            : "没有可移动的步数了。";
      }

      function hideOverlay() {
        overlay.hidden = true;
      }

      function spawn() {
        const empty = emptyCells(tiles);
        if (!empty.length) return;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        tiles.push(makeTile(r, c, Math.random() < 0.9 ? 2 : 4));
      }

      function finishTurn(gained) {
        updateScore(gained);
        const reached = tiles.some((tile) => tile.value >= 2048);
        const playable = hasMoves(tiles);
        if (!won && reached && !continued) {
          won = true;
          over = !playable;
          showOverlay(playable ? "win" : "win-dead");
          return;
        }
        if (reached) won = true;
        if (!playable) {
          over = true;
          showOverlay("lose");
        }
      }

      function act(dir) {
        if (over || !overlay.hidden) return;
        const result = moveBoard(tiles, dir);
        if (!result.moved) return;
        tiles = result.tiles;
        score += result.gained;
        spawn();
        render(result.removed, true);
        finishTurn(result.gained);
      }

      function newGame() {
        tiles = [];
        score = 0;
        won = false;
        continued = false;
        over = false;
        tileEls.forEach((el) => el.remove());
        tileEls.clear();
        hideOverlay();
        status.textContent = "新游戏开始";
        spawn();
        spawn();
        updateScore(0);
        render([], true);
      }

      document.getElementById("restart").addEventListener("click", newGame);
      document.getElementById("restart-overlay").addEventListener("click", newGame);
      continueBtn.addEventListener("click", () => {
        continued = true;
        hideOverlay();
        status.textContent = "继续游戏";
        if (!hasMoves(tiles)) {
          over = true;
          showOverlay("lose");
        }
      });

      document.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        const map = {
          arrowleft: "left",
          arrowright: "right",
          arrowup: "up",
          arrowdown: "down",
          a: "left",
          d: "right",
          w: "up",
          s: "down"
        };
        const dir = map[key];
        if (!dir) return;
        event.preventDefault();
        act(dir);
      });

      let pointer = null;
      board.addEventListener("pointerdown", (event) => {
        if (!event.isPrimary) return;
        if (event.pointerType === "mouse" && event.button !== 0) return;
        pointer = { x: event.clientX, y: event.clientY, id: event.pointerId };
        board.setPointerCapture(event.pointerId);
      });
      board.addEventListener("pointerup", (event) => {
        if (!pointer || pointer.id !== event.pointerId) return;
        const dx = event.clientX - pointer.x;
        const dy = event.clientY - pointer.y;
        pointer = null;
        const absX = Math.abs(dx);
        const absY = Math.abs(dy);
        if (Math.max(absX, absY) < 24) return;
        act(absX > absY ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      });
      board.addEventListener("pointercancel", () => {
        pointer = null;
      });

      window.addEventListener("resize", () => render([], false));
      newGame();
    }
  </script>
</body>
</html>
