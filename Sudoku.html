<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef">
<title>數獨日常</title>
<style>
:root{--ink:#24332d;--muted:#78837c;--paper:#f7f5ef;--card:#fffefa;--line:#e6e4db;--green:#2d725a;--mint:#e7f1e9;--gold:#d9a441;--bad:#f8e2dc;--shadow:0 16px 40px #25372b12}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100vh}.wrap{max-width:1080px;margin:auto;padding:28px 28px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;letter-spacing:.04em}.logo{width:38px;height:38px;background:var(--green);color:white;border-radius:13px;display:grid;place-items:center;font-size:20px}.top-right{color:var(--muted);font-size:13px}.hero{display:flex;justify-content:space-between;align-items:end;margin:0 0 24px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-size:clamp(30px,5vw,44px);line-height:1.1;margin:8px 0 10px;letter-spacing:-.04em}.hero p{margin:0;color:var(--muted);font-size:14px}.game{display:grid;grid-template-columns:minmax(310px,590px) minmax(260px,1fr);gap:30px;align-items:start}.board-card,.side-card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.board-card{padding:20px}.board-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 16px}.level{font-size:13px;color:var(--muted)}.level strong{color:var(--ink);margin-left:6px}.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--green);font-size:14px}.grid{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid #50665b;border-radius:8px;overflow:hidden;aspect-ratio:1}.cell{position:relative;border:0;border-right:1px solid #d9ded7;border-bottom:1px solid #d9ded7;background:#fffefa;color:var(--ink);font:500 clamp(17px,3vw,27px)/1 inherit;display:grid;place-items:center;padding:0;cursor:pointer;transition:background .12s}.cell:nth-child(3n){border-right:2px solid #77877d}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #77877d}.cell:nth-child(n+73){border-bottom:0}.cell.given{font-weight:800;color:#293b33}.cell.selected{background:#dcece0!important}.cell.related{background:#f2f5ed}.cell.same{background:#e6f0e6;color:var(--green);font-weight:750}.cell.error{background:var(--bad)!important;color:#a34d3e}.cell:focus-visible{outline:3px solid var(--gold);outline-offset:-3px;z-index:2}.notes{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(7px,1.2vw,11px);color:#73837a;line-height:1}.tools{display:flex;gap:9px;margin-top:15px}.tool{flex:1;border:1px solid var(--line);background:white;border-radius:12px;padding:10px 8px;color:var(--ink);font:600 12px inherit;cursor:pointer}.tool:hover,.tool.on{border-color:#a9c5b1;background:var(--mint);color:var(--green)}.side-card{padding:22px}.section-label{font-size:12px;color:var(--muted);font-weight:750;letter-spacing:.08em;margin:0 0 12px}.controls{display:flex;gap:8px}.select{flex:1;border:1px solid var(--line);border-radius:11px;background:#fffefa;padding:10px 11px;font:600 13px inherit;color:var(--ink)}.new-btn{border:0;background:var(--green);color:white;padding:0 16px;border-radius:11px;font:700 13px inherit;cursor:pointer}.new-btn:hover{background:#235d49}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.stat{background:#f6f6f0;border-radius:14px;padding:13px}.stat span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.stat strong{font-size:19px;font-variant-numeric:tabular-nums}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.num{height:46px;border:1px solid var(--line);border-radius:12px;background:white;font-size:19px;font-weight:700;color:var(--green);cursor:pointer}.num:hover{background:var(--mint);border-color:#b9d0bf}.num:disabled{opacity:.35;cursor:default}.progress{height:6px;background:#eeeee7;border-radius:8px;margin:17px 0 20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#76a486;border-radius:8px;transition:width .25s}.hint{margin-top:20px;padding:15px;background:#f3f5ef;border-radius:14px;color:#68766d;font-size:12px;line-height:1.7}.hint b{color:var(--green)}.status{min-height:20px;margin-top:14px;font-size:12px;color:var(--muted);text-align:center}.status.success{color:var(--green);font-weight:700}.foot{display:flex;justify-content:space-between;color:#9a9f98;font-size:11px;margin:22px 4px 0}.hidden{display:none!important}@media(max-width:780px){.wrap{padding:18px 14px 28px}.top{margin-bottom:25px}.hero{margin-bottom:19px}.game{grid-template-columns:1fr;gap:14px}.board-card{padding:13px;border-radius:19px}.side-card{padding:18px;border-radius:19px}.cell{font-size:clamp(18px,6vw,26px)}.tools{gap:6px}.tool{padding:10px 3px;font-size:11px}.numbers{grid-template-columns:repeat(9,1fr);gap:5px}.num{height:42px}.hint{margin-top:14px}.foot{margin-top:17px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="logo">九</div>數獨日常</div><div class="top-right">留一點時間，給專注的自己</div></header><section class="hero"><div><div class="eyebrow">A little focus, every day</div><h1>來一盤數獨吧。</h1><p>讓思緒慢下來，答案自然會浮現。</p></div></section><section class="game"><div class="board-card"><div class="board-head"><div class="level">目前難度<strong id="levelLabel">簡單</strong></div><div class="timer" id="timer">00:00</div></div><div class="grid" id="grid" role="grid" aria-label="數獨棋盤"></div><div class="tools"><button class="tool" id="noteBtn">✎　筆記</button><button class="tool" id="eraseBtn">⌫　清除</button><button class="tool" id="undoBtn">↶　復原</button><button class="tool" id="checkBtn">✓　檢查</button></div><div class="status" id="status" aria-live="polite">選取格子後，點數字或使用鍵盤輸入。</div></div><aside class="side-card"><p class="section-label">開始新遊戲</p><div class="controls"><select class="select" id="difficulty" aria-label="選擇難度"><option value="easy">簡單</option><option value="medium">中等</option><option value="hard">困難</option></select><button class="new-btn" id="newBtn">新的一局</button></div><div class="stats"><div class="stat"><span>已填格數</span><strong id="filled">0 / 81</strong></div><div class="stat"><span>錯誤次數</span><strong id="mistakes">0</strong></div></div><div class="progress"><i id="progress"></i></div><p class="section-label">輸入數字</p><div class="numbers" id="numbers"></div><div class="hint"><b>小提示</b><br>每一列、每一行，以及每個 3 × 3 宮格，都要包含 1 到 9，且不能重複。你可以用鍵盤的方向鍵移動格子。</div></aside></section><footer class="foot"><span>不趕時間，慢慢解。</span><span>數獨日常 · 01</span></footer></main>
<script>
(()=>{const grid=document.querySelector('#grid'),numbers=document.querySelector('#numbers'),status=document.querySelector('#status');let solution=[],board=[],fixed=[],notes=[],selected=-1,noteMode=false,mistakes=0,seconds=0,history=[],timerId;
const base=(r,c)=>((r*3+Math.floor(r/3)+c)%9);function shuffled(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function makeSolution(){let rows=[],cols=[];for(let g of shuffled([0,1,2]))for(let x of shuffled([0,1,2]))rows.push(g*3+x);for(let g of shuffled([0,1,2]))for(let x of shuffled([0,1,2]))cols.push(g*3+x);let digits=shuffled([1,2,3,4,5,6,7,8,9]);return rows.map(r=>cols.map(c=>digits[base(r,c)]))}
function fresh(){clearInterval(timerId);seconds=0;mistakes=0;history=[];selected=-1;noteMode=false;document.querySelector('#noteBtn').classList.remove('on');solution=makeSolution();board=solution.map(row=>row.slice());fixed=Array.from({length:9},()=>Array(9).fill(false));notes=Array.from({length:9},()=>Array.from({length:9},()=>new Set()));let keep={easy:39,medium:32,hard:27}[document.querySelector('#difficulty').value],all=shuffled(Array.from({length:81},(_,i)=>i));for(let i=0;i<81-keep;i++){let n=all[i];board[Math.floor(n/9)][n%9]=0}fixed=board.map(r=>r.map(Boolean));document.querySelector('#levelLabel').textContent=document.querySelector('#difficulty').selectedOptions[0].textContent;timerId=setInterval(()=>{seconds++;document.querySelector('#timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')},1000);status.textContent='選取格子後，點數字或使用鍵盤輸入。';status.className='status';render()}
function render(){grid.innerHTML='';for(let r=0;r<9;r++)for(let c=0;c<9;c++){let i=r*9+c,v=board[r][c],el=document.createElement('button');el.className='cell';el.setAttribute('role','gridcell');el.setAttribute('aria-label',`${r+1}列${c+1}行${v||'空白'}`);if(fixed[r][c])el.classList.add('given');if(selected===i)el.classList.add('selected');else if(selected>=0){let sr=Math.floor(selected/9),sc=selected%9;if(r===sr||c===sc||(Math.floor(r/3)===Math.floor(sr/3)&&Math.floor(c/3)===Math.floor(sc/3)))el.classList.add('related');if(v&&v===board[sr][sc])el.classList.add('same')}if(v&&v!==solution[r][c]&&!fixed[r][c])el.classList.add('error');if(v)el.textContent=v;else if(notes[r][c].size){let ns=document.createElement('span');ns.className='notes';for(let n=1;n<=9;n++){let s=document.createElement('span');s.textContent=notes[r][c].has(n)?n:'';ns.appendChild(s)}el.appendChild(ns)}el.onclick=()=>{selected=i;render()};grid.appendChild(el)}update()}
function update(){let count=board.flat().filter(Boolean).length;document.querySelector('#filled').textContent=`${count} / 81`;document.querySelector('#mistakes').textContent=mistakes;document.querySelector('#progress').style.width=(count/81*100)+'%';for(let n=1;n<=9;n++){let used=board.flat().filter(x=>x===n).length;let b=numbers.children[n-1];if(b)b.disabled=used>=9}}
function enter(n){if(selected<0)return;let r=Math.floor(selected/9),c=selected%9;if(fixed[r][c])return;history.push({r,c,v:board[r][c],notes:new Set(notes[r][c])});if(noteMode){if(notes[r][c].has(n))notes[r][c].delete(n);else notes[r][c].add(n)}else{board[r][c]=n;notes[r][c].clear()}render();if(board[r][c]&&board[r][c]!==solution[r][c]){mistakes++;document.querySelector('#mistakes').textContent=mistakes;status.textContent='這個數字和題目答案不符，試試別的數字。';status.className='status'}else{status.textContent='選取格子後，點數字或使用鍵盤輸入。';status.className='status'}if(board.flat().every((v,i)=>v===solution[Math.floor(i/9)][i%9])){clearInterval(timerId);status.textContent='太棒了！你完成這盤數獨了。';status.className='status success'}}
for(let n=1;n<=9;n++){let b=document.createElement('button');b.className='num';b.textContent=n;b.onclick=()=>enter(n);numbers.appendChild(b)}document.querySelector('#newBtn').onclick=fresh;document.querySelector('#difficulty').onchange=fresh;document.querySelector('#noteBtn').onclick=()=>{noteMode=!noteMode;document.querySelector('#noteBtn').classList.toggle('on',noteMode);status.textContent=noteMode?'筆記模式已開啟，輸入數字以新增或移除候選數。':'筆記模式已關閉。'};document.querySelector('#eraseBtn').onclick=()=>{if(selected<0)return;let r=Math.floor(selected/9),c=selected%9;if(!fixed[r][c]){history.push({r,c,v:board[r][c],notes:new Set(notes[r][c])});board[r][c]=0;notes[r][c].clear();render()}};document.querySelector('#undoBtn').onclick=()=>{let h=history.pop();if(h){board[h.r][h.c]=h.v;notes[h.r][h.c]=h.notes;render()}};document.querySelector('#checkBtn').onclick=()=>{let wrong=0,empty=0;board.forEach((row,r)=>row.forEach((v,c)=>{if(!v)empty++;else if(v!==solution[r][c])wrong++}));status.textContent=wrong?`找到 ${wrong} 個不正確的數字，再檢查一下。`:empty?`目前填入的數字都正確，還有 ${empty} 格待完成。`:'太棒了！你完成這盤數獨了。';status.className='status'+(!wrong&&!empty?' success':'')};document.addEventListener('keydown',e=>{if(e.target.matches('select'))return;if(/^[1-9]$/.test(e.key)){enter(+e.key);e.preventDefault()}else if(e.key==='Backspace'||e.key==='Delete')document.querySelector('#eraseBtn').click();else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(selected<0)selected=40;else{let r=Math.floor(selected/9),c=selected%9;if(e.key==='ArrowUp')r=(r+8)%9;if(e.key==='ArrowDown')r=(r+1)%9;if(e.key==='ArrowLeft')c=(c+8)%9;if(e.key==='ArrowRight')c=(c+1)%9;selected=r*9+c}render()}});fresh()})();
</script></body></html>
